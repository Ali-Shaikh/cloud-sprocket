apiVersion: cloudsprocket.recipe/v1
id: magento-commerce-compose
kind: app-deploy
version: 0.2.0
name: Magento commerce (Docker Compose)
summary: Magento 2 locally with a simple shinsenter stack or a full official Adobe OSS stack.
description: |
  Runs Magento on your machine with Docker Compose. Pick a stack profile:

  - **Simple** — shinsenter/magento with MariaDB and Redis (~5–10 minutes first boot, ~4 GB Docker RAM).
  - **Official** — Mark Shust-style Adobe Magento Open Source via Composer with OpenSearch and RabbitMQ (~15–25 minutes first boot, ~6 GB Docker RAM, Adobe Marketplace keys required).

  OpenTofu records deployment metadata only; containers start in post-apply steps after apply succeeds.
  Requires Docker Desktop (or another Docker engine) with the Compose plugin.
providers:
  - aws
tags:
  - magento
  - commerce
  - ecommerce
  - docker-compose
  - mysql
  - redis
engine:
  type: opentofu
  minVersion: "1.6.0"
local:
  runtimes:
    - id: magento-compose
postApply:
  - name: Start Magento stack
    dirVar: compose_dir
    requires: docker-compose.yml
    command: ["docker", "compose", "up", "-d"]
  - name: Install Magento (official)
    dirVar: compose_dir
    requires: scripts/setup-official.sh
    command: ["bash", "scripts/setup-official.sh"]
variableGroups:
  - title: Application
    variables:
      - name: app_name
        widget: text
        help: Lowercase name prefix recorded in deployment outputs.
      - name: environment
        widget: select
        options: [dev, staging, prod]
  - title: Stack profile
    variables:
      - name: stack_profile
        widget: select
        options: [simple, official]
        help: Simple uses the shinsenter auto-installer. Official installs Adobe Magento Open Source via Composer.
      - name: magento_image_channel
        widget: select
        options: [latest, stable]
        visibleWhen:
          variable: stack_profile
          equals: simple
        help: |
          latest — newest upstream shinsenter build (may change daily).
          stable — pinned tag you control: docker pull shinsenter/magento:latest && docker tag shinsenter/magento:latest shinsenter/magento:stable
      - name: magento_base_url
        widget: text
        help: Public base URL for the shop. Defaults to the local Compose port.
  - title: Adobe Marketplace
    variables:
      - name: magento_public_key
        widget: text
        visibleWhen:
          variable: stack_profile
          equals: official
        help: Public key from Adobe Marketplace → Access Keys.
      - name: magento_private_key
        widget: password
        visibleWhen:
          variable: stack_profile
          equals: official
        help: Private key from Adobe Marketplace → Access Keys.
  - title: Store admin
    variables:
      - name: magento_admin_user
        widget: text
        visibleWhen:
          variable: stack_profile
          equals: official
      - name: magento_admin_password
        widget: password
        visibleWhen:
          variable: stack_profile
          equals: official
      - name: magento_admin_email
        widget: text
        visibleWhen:
          variable: stack_profile
          equals: official
  - title: Developer options
    variables:
      - name: expose_debug_ports
        widget: switch
        visibleWhen:
          variable: stack_profile
          equals: official
        help: Expose MariaDB (3306), OpenSearch (9200), and RabbitMQ UI (15672) on 127.0.0.1. Off by default.
outputs:
  - name: storefront_url
    primary: true
  - name: compose_project
  - name: stack_profile