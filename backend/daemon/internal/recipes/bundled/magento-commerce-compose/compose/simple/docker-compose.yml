services:
  mariadb:
    image: docker.io/library/mariadb:12.3
    environment:
      MYSQL_ROOT_PASSWORD: root-secret
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento-secret
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: docker.io/library/redis:7.4-alpine
    volumes:
      - redis-data:/data

  magento:
    image: docker.io/shinsenter/magento:${MAGENTO_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8080:80"
    environment:
      APP_URL: ${MAGENTO_BASE_URL:-http://localhost:8080}
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: magento
      DB_USER: magento
      DB_PASSWORD: magento-secret
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - magento-data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mariadb-data:
  redis-data:
  magento-data: