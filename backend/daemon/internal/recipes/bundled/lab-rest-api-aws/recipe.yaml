apiVersion: cloudsprocket.recipe/v1
id: lab-rest-api-aws
kind: service-lab
version: 0.1.0
name: REST API lab (AWS API Gateway + Lambda)
summary: A minimal HTTP API on API Gateway backed by a Node.js Lambda.
description: |
  A focused service lab for a serverless REST API: a Node.js Lambda behind an
  HTTP API Gateway. Point `backend_source_dir` at your handler folder or keep
  the bundled sample API for a first deployment.

  Uses only API Gateway and Lambda, which emulate on LocalStack's free tier,
  so it dry-runs locally and ships unchanged to real AWS by switching the
  connection profile.
providers:
  - aws
tags:
  - api
  - rest
  - lambda
  - apigateway
  - aws
  - lab
engine:
  type: opentofu
  minVersion: "1.6.0"
local:
  runtimes:
    - id: localstack
build:
  - name: Install backend dependencies
    dirVar: backend_source_dir
    requires: package.json
    command: ["npm", "install", "--omit=dev"]
variableGroups:
  - title: Application
    variables:
      - name: app_name
        widget: text
        help: Lowercase name prefix used for every resource.
      - name: environment
        widget: select
        options: [dev, staging, prod]
      - name: aws_region
        widget: text
  - title: API code
    variables:
      - name: backend_source_dir
        widget: directory
        help: Folder with your Node API handler.handler export. Leave default for the sample API.
      - name: lambda_memory_mb
        widget: number
        help: Memory for the API Lambda, in megabytes.
  - title: Advanced
    variables:
      - name: tags
        widget: textarea
        help: Extra tags as a JSON object, applied to every resource.
outputs:
  - name: api_endpoint
    primary: true
  - name: lambda_function_name
lab:
  difficulty: beginner
  estimatedMinutes: 20
  objectives:
    - Call the deployed HTTP API and confirm a successful response
    - Inspect the backing Lambda function in the workspace
  steps:
    - id: call-api
      title: Call the API endpoint
      body: |
        Run the check to send an HTTP GET to the API Gateway invoke URL from the
        `api_endpoint` output. A 2xx response means the sample handler is live.
      verify:
        - type: http.get
          url: "{{ outputs.api_endpoint }}"
      hints:
        - LocalStack may take a few seconds after apply before the endpoint responds.
    - id: inspect-lambda
      title: Inspect the API Lambda
      body: |
        Open the Lambda tab to view the function behind the HTTP API.
      actions:
        - type: open-tab
          tab: aws-lambda
          focus: "{{ outputs.lambda_function_name }}"
      hints:
        - The function name matches the `lambda_function_name` output.