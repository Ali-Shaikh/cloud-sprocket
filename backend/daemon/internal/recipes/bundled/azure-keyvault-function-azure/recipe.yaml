apiVersion: cloudsprocket.recipe/v1
id: azure-keyvault-function-azure
kind: app-deploy
version: 0.1.0
name: Key Vault backed Functions (Azure)
summary: Azure Functions with access to Key Vault for secrets (security pattern).
description: |
  Security on Azure: function app with managed identity access to Key Vault.
  Sample demonstrates secret lifecycle.

  floci-az supported for Key Vault emulation.
providers:
  - azure
tags:
  - azure
  - functions
  - keyvault
  - security
  - floci-az
engine:
  type: opentofu
  minVersion: "1.6.0"
local:
  runtimes:
    - id: floci-az
variableGroups:
  - title: Application
    variables:
      - name: app_name
        widget: text
        help: Lowercase prefix.
      - name: environment
        widget: select
        options: [dev, staging, prod]
      - name: azure_location
        widget: text
      - name: azure_tenant_id
        widget: text
        help: Tenant ID (use placeholder for local floci-az).
  - title: Code
    variables:
      - name: backend_source_dir
        widget: directory
        help: Default sample.
  - title: Advanced
    variables:
      - name: tags
        widget: textarea
outputs:
  - name: key_vault_name
    primary: true
  - name: function_app_name
  - name: resource_group_name
lab:
  difficulty: intermediate
  estimatedMinutes: 20
  objectives:
    - See Key Vault + function with access policy
  steps:
    - id: vault
      title: Inspect Key Vault
      body: Open relevant tab.
      actions:
        - type: open-tab
          tab: azure-keyvault
          focus: "{{ outputs.key_vault_name }}"
