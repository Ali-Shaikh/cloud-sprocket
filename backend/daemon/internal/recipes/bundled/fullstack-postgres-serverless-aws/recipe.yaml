apiVersion: cloudsprocket.recipe/v1
id: fullstack-postgres-serverless-aws
kind: app-deploy
version: 0.1.0
name: Full-stack Postgres (serverless)
summary: Static frontend on S3, a Node API on Lambda behind API Gateway, and a managed Postgres database on RDS.
description: |
  A serverless full-stack starter with a static frontend on S3, a Node backend on
  Lambda behind API Gateway, and a Postgres database on RDS. The bundled sample
  frontend and API deploy when you do not supply your own code, so a first apply
  works without custom application code.

  Uses RDS, which only emulates on LocalStack Pro. Use a LocalStack Pro/Team auth
  token for the local dry-run, or deploy to real AWS by switching the connection
  profile.

  Point `backend_source_dir` at your handler folder or keep the bundled sample.
  Point `frontend_dist_dir` at your built static site or keep the bundled sample.
providers:
  - aws
tags:
  - serverless
  - fullstack
  - postgres
  - api
  - aws
  - starter
engine:
  type: opentofu
  minVersion: "1.6.0"
local:
  runtimes:
    - id: localstack
      requiresPro: true
superpowers:
  iamPolicyStream: true
build:
  - name: Install backend dependencies
    dirVar: backend_source_dir
    requires: package.json
    command: ["npm", "ci", "--omit=dev"]
  - name: Run migrations
    dirVar: backend_source_dir
    requires: prisma/schema.prisma
    command: ["npx", "prisma", "migrate", "deploy"]
    continueOnError: true
variableGroups:
  - title: Application
    variables:
      - name: app_name
        widget: text
      - name: environment
        widget: select
        options: [dev, staging, prod]
      - name: aws_region
        widget: text
  - title: Application code
    variables:
      - name: backend_source_dir
        widget: directory
        help: Folder with your Node backend handler.handler export. Leave default for the sample API.
      - name: frontend_dist_dir
        widget: directory
        help: Folder of your built static frontend (e.g. Next.js `out/`). Leave default for the sample site.
  - title: Backend
    variables:
      - name: lambda_memory_mb
        widget: number
  - title: Database
    variables:
      - name: db_username
        widget: text
      - name: db_password
        widget: password
      - name: db_instance_class
        widget: text
  - title: Advanced
    variables:
      - name: tags
        widget: textarea
outputs:
  - name: api_endpoint
  - name: frontend_website_endpoint
    primary: true
  - name: database_url
    primary: true
  - name: frontend_bucket
  - name: database_endpoint