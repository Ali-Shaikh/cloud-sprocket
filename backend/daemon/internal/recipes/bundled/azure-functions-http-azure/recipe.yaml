apiVersion: cloudsprocket.recipe/v1
id: azure-functions-http-azure
kind: app-deploy
version: 0.1.1
name: HTTP Functions (Azure)
summary: Deploy a Linux Function App with an HTTP trigger on a real Azure subscription.
description: |
  Azure compute pattern: serverless HTTP endpoint via Azure Functions. Point at
  your function code or use the sample. Includes a storage account for the
  Functions runtime.

  Requires a cloud Azure profile with permission to create resource groups,
  storage accounts, App Service plans, and Function Apps. floci-az does not
  fully emulate this stack.
providers:
  - azure
tags:
  - azure
  - functions
  - serverless
  - http
  - cloud-azure
engine:
  type: opentofu
  minVersion: "1.6.0"
local:
  runtimes: []
variableGroups:
  - title: Application
    variables:
      - name: app_name
        widget: text
        help: Lowercase name prefix used for every resource.
      - name: environment
        widget: select
        options: [dev, staging, prod]
      - name: azure_location
        widget: text
        help: Azure region for the function app and storage.
  - title: Function code
    variables:
      - name: backend_source_dir
        widget: directory
        help: Folder containing Azure Functions code (host.json + function). Default sample.
  - title: Advanced
    variables:
      - name: tags
        widget: textarea
        help: Extra tags as JSON object.
outputs:
  - name: function_app_name
    primary: true
  - name: function_app_url
  - name: resource_group_name
lab:
  difficulty: beginner
  estimatedMinutes: 20
  objectives:
    - Deploy Azure Function app with HTTP trigger
    - Call the endpoint or inspect in Azure tab
  steps:
    - id: call-endpoint
      title: Call the function endpoint
      body: |
        Use the function_app_url output to GET the HTTP trigger. A working
        response confirms the function is live on Azure.
      verify:
        - type: http.get
          url: "{{ outputs.function_app_url }}"
      hints:
        - Allow a short time after apply for the host to become ready.
    - id: inspect-function
      title: Inspect in workspace
      body: Open the Azure Functions tab for the function app.
      actions:
        - type: open-tab
          tab: azure-functions
          focus: "{{ outputs.function_app_name }}"
