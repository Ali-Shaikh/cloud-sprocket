apiVersion: cloudsprocket.recipe/v1
id: api-postgres-containers-aws
kind: app-deploy
version: 0.1.0
name: API + Postgres (containers)
summary: A container API on ECS Fargate behind an ALB with a managed Postgres database on RDS.
description: |
  Deploy your backend as a long-running container on ECS Fargate behind an
  Application Load Balancer, with a managed Postgres database on RDS. Defaults
  use a public nginx image so a first deployment works without custom
  application code.

  Uses ECS, RDS and ELBv2, which only emulate on LocalStack Pro. Use a
  LocalStack Pro/Team auth token for the local dry-run, or deploy to real AWS by
  switching the connection profile.
providers:
  - aws
tags:
  - container
  - postgres
  - api
  - aws
  - ecs
  - rds
engine:
  type: opentofu
  minVersion: "1.6.0"
local:
  runtimes:
    - id: localstack
      requiresPro: true
superpowers:
  iamPolicyStream: true
imageBuild:
  dockerfileDirVar: dockerfile_dir
  imageVar: container_image
postApply:
  - name: Run database migrations
    dirVar: dockerfile_dir
    requires: prisma/schema.prisma
    command: ["npx", "prisma", "migrate", "deploy"]
    continueOnError: true
variableGroups:
  - title: Application
    variables:
      - name: app_name
        widget: text
      - name: environment
        widget: select
        options: [dev, staging, prod]
      - name: aws_region
        widget: text
  - title: Backend container
    variables:
      - name: dockerfile_dir
        widget: directory
        help: Folder with your Dockerfile. When set, the app builds and pushes the image before plan (overrides container_image).
      - name: container_image
        widget: text
        help: Pre-built image URI. Ignored when dockerfile_dir contains a Dockerfile. Default serves HTTP on port 80.
      - name: container_port
        widget: number
      - name: desired_count
        widget: number
        help: Number of Fargate tasks to run.
  - title: Database
    variables:
      - name: db_username
        widget: text
      - name: db_password
        widget: password
      - name: db_instance_class
        widget: text
  - title: Advanced
    variables:
      - name: tags
        widget: textarea
        help: Extra tags as a JSON object.
outputs:
  - name: api_endpoint
    primary: true
  - name: database_url
    primary: true
  - name: database_endpoint
  - name: ecs_cluster