apiVersion: cloudsprocket.recipe/v1
id: lab-queue-worker-aws
kind: service-lab
version: 0.1.0
name: Queue worker lab (AWS SQS + Lambda)
summary: An SQS queue with a dead-letter queue and a Node.js Lambda consumer.
description: |
  A focused service lab for asynchronous work: an SQS queue with a dead-letter
  queue and a Node.js Lambda triggered by an event source mapping. Point
  `backend_source_dir` at your handler folder or keep the bundled sample worker
  for a first deployment.

  Uses only SQS and Lambda, which emulate on LocalStack's free tier, so it
  dry-runs locally and ships unchanged to real AWS by switching the connection
  profile.
providers:
  - aws
tags:
  - queue
  - sqs
  - worker
  - lambda
  - aws
  - lab
engine:
  type: opentofu
  minVersion: "1.6.0"
local:
  runtimes:
    - id: localstack
    - id: docker-compose
build:
  - name: Install backend dependencies
    dirVar: backend_source_dir
    requires: package.json
    command: ["npm", "install", "--omit=dev"]
variableGroups:
  - title: Application
    variables:
      - name: app_name
        widget: text
        help: Lowercase name prefix used for every resource.
      - name: environment
        widget: select
        options: [dev, staging, prod]
      - name: aws_region
        widget: text
  - title: Worker code
    variables:
      - name: backend_source_dir
        widget: directory
        help: Folder with your Node worker handler.handler export. Leave default for the sample worker.
      - name: lambda_memory_mb
        widget: number
        help: Memory for the worker Lambda, in megabytes.
  - title: Advanced
    variables:
      - name: tags
        widget: textarea
        help: Extra tags as a JSON object, applied to every resource.
outputs:
  - name: queue_url
    primary: true
  - name: lambda_function_name
lab:
  difficulty: beginner
  estimatedMinutes: 25
  objectives:
    - Understand how an SQS queue triggers a Lambda worker
    - Send a message and verify queue activity
    - Observe a controlled local runtime outage and automatic recovery
    - Inspect the consumer function in the workspace
  steps:
    - id: explore-queue
      title: Explore the SQS queue
      body: |
        Open the SQS tab and inspect the main queue created by this deployment.
        Note the queue URL and approximate message counts.
      actions:
        - type: open-tab
          tab: aws-sqs
          focus: "{{ outputs.queue_url }}"
      hints:
        - The queue name is prefixed with your app name and environment.
    - id: send-message
      title: Send a test message
      body: |
        Send a JSON message to the queue so the worker Lambda can process it.
      actions:
        - type: invoke-write
          op: sqs.send
          params:
            queueUrl: "{{ outputs.queue_url }}"
            messageBody: '{"lab":"queue-worker","demo":1}'
      hints:
        - Use the action button below to send the bundled sample payload.
    - id: verify-queue
      title: Verify queue activity
      body: |
        Run the check to confirm messages are visible or in flight while the worker runs.
      verify:
        - type: sqs.queue-attribute
          queue: "{{ outputs.queue_url }}"
          attribute: ApproximateNumberOfMessagesNotVisible
          compare: gte
          value: "0"
      hints:
        - Messages may move to "in flight" quickly when the Lambda polls the queue.
    - id: observe-runtime-outage
      title: Observe a controlled queue outage
      body: |
        Run a short, local-only outage check. On the Docker Compose target,
        CloudSprocket pauses the managed AWS runtime container, confirms its
        health endpoint is unreachable, and restores the container before this
        check returns. Other runtimes skip this step with a capability reason.
      fault:
        kind: pause
        target: cloudsprocket-localstack-localstack-1
      verify:
        - type: http.unreachable
          url: http://localhost:4566/_localstack/health
      hints:
        - The recovery journal is written before Docker is changed, so a daemon restart can safely replay the unpause.
        - This uses Docker pause and unpause only. It does not call a vendor chaos API.
    - id: inspect-lambda
      title: Inspect the worker Lambda
      body: |
        Open the Lambda tab to view the consumer function wired to the queue,
        then run a safe test invoke to confirm the function is healthy.
      actions:
        - type: open-tab
          tab: aws-lambda
          focus: "{{ outputs.lambda_function_name }}"
      verify:
        - type: lambda.invoke
          function: "{{ outputs.lambda_function_name }}"
          payload: '{"source":"lab"}'
      hints:
        - The function name matches the deployment output `lambda_function_name`.
