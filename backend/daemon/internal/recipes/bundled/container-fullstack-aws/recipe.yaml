apiVersion: cloudsprocket.recipe/v1
id: container-fullstack-aws
kind: app-deploy
version: 0.2.0
name: Container full-stack (AWS)
summary: A long-running Node container on ECS Fargate behind an ALB, a Postgres RDS database, and a CloudFront-fronted frontend.
description: |
  The traditional shape: a backend container runs on ECS Fargate behind an
  Application Load Balancer, with a managed Postgres database on RDS and a
  static frontend served from S3 through CloudFront. Defaults use a public nginx
  image and bundled sample frontend so a first deployment works without custom
  application code.

  Uses ECS, RDS, ELBv2 and CloudFront, which only emulate on LocalStack Pro. Use a
  LocalStack Pro/Team auth token for the local dry-run, or deploy to real AWS by
  switching the connection profile.
providers:
  - aws
tags:
  - container
  - fullstack
  - aws
  - ecs
  - rds
engine:
  type: opentofu
  minVersion: "1.6.0"
local:
  runtimes:
    - id: localstack
      requiresPro: true
superpowers:
  iamPolicyStream: true
imageBuild:
  dockerfileDirVar: dockerfile_dir
  imageVar: container_image
variableGroups:
  - title: Application
    variables:
      - name: app_name
        widget: text
      - name: environment
        widget: select
        options: [dev, staging, prod]
      - name: aws_region
        widget: text
  - title: Backend container
    variables:
      - name: dockerfile_dir
        widget: directory
        help: Folder with your Dockerfile. When set, the app builds and pushes the image before plan (overrides container_image).
      - name: container_image
        widget: text
        help: Pre-built image URI. Ignored when dockerfile_dir contains a Dockerfile. Default serves HTTP on port 80.
      - name: container_port
        widget: number
      - name: desired_count
        widget: number
        help: Number of Fargate tasks to run.
  - title: Database
    variables:
      - name: db_username
        widget: text
      - name: db_password
        widget: password
      - name: db_instance_class
        widget: text
  - title: Frontend
    variables:
      - name: frontend_dist_dir
        widget: directory
        help: Folder of your built static frontend. Leave default for the sample frontend.
  - title: Advanced
    variables:
      - name: tags
        widget: textarea
        help: Extra tags as a JSON object.
outputs:
  - name: alb_dns_name
    primary: true
  - name: frontend_url
    primary: true
  - name: frontend_website_endpoint
  - name: database_endpoint
  - name: database_url
    primary: true
  - name: ecs_cluster
