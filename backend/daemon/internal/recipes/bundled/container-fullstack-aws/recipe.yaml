apiVersion: cloudsprocket.recipe/v1
id: container-fullstack-aws
version: 0.1.0
name: Container full-stack (AWS)
summary: A long-running Node container on ECS Fargate behind an ALB, a Postgres RDS database, and a CloudFront-fronted frontend.
description: |
  The traditional shape: your Node backend runs as a persistent container on ECS
  Fargate behind an Application Load Balancer, with a managed Postgres database on
  RDS and a static frontend served from S3 through CloudFront.

  Uses ECS, RDS, ELBv2 and CloudFront, which only emulate on LocalStack Pro. Use a
  LocalStack Pro/Team auth token for the local dry-run, or deploy to real AWS by
  switching the connection profile.
providers:
  - aws
tags:
  - container
  - fullstack
  - aws
  - ecs
  - rds
engine:
  type: opentofu
  minVersion: "1.6.0"
local:
  emulator: localstack
  requiresPro: true
variableGroups:
  - title: Application
    variables:
      - name: app_name
        widget: text
      - name: environment
        widget: select
        options: [dev, staging, prod]
      - name: aws_region
        widget: text
  - title: Backend container
    variables:
      - name: container_image
        widget: text
        help: Container image for the backend (e.g. your ECR image or a public image).
      - name: container_port
        widget: number
      - name: desired_count
        widget: number
        help: Number of Fargate tasks to run.
  - title: Database
    variables:
      - name: db_username
        widget: text
      - name: db_password
        widget: password
      - name: db_instance_class
        widget: text
  - title: Frontend
    variables:
      - name: frontend_dist_dir
        widget: directory
        help: Folder of your built static frontend. Leave blank to skip.
  - title: Advanced
    variables:
      - name: tags
        widget: textarea
        help: Extra tags as a JSON object.
outputs:
  - name: alb_dns_name
    primary: true
  - name: frontend_url
    primary: true
  - name: database_endpoint
  - name: ecs_cluster
