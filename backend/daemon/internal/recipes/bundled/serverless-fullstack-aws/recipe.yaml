apiVersion: cloudsprocket.recipe/v1
id: serverless-fullstack-aws
kind: app-deploy
version: 0.2.0
name: Serverless full-stack (AWS)
summary: Static frontend on S3, a Node API on Lambda behind API Gateway, and a DynamoDB table.
description: |
  A serverless full-stack starter that runs entirely on LocalStack's free tier
  and ships unchanged to real AWS by switching the connection profile.

  Provisions an S3 website bucket for a static frontend, a Node.js Lambda
  exposed through an HTTP API Gateway as the backend, and a DynamoDB table for
  data. Bundled sample frontend and API code deploy when you do not supply your
  own code. No RDS/ECS/CloudFront, so it stays within the free local emulator
  services.
providers:
  - aws
tags:
  - serverless
  - fullstack
  - aws
  - starter
engine:
  type: opentofu
  minVersion: "1.6.0"
local:
  runtimes:
    - id: localstack
superpowers:
  iamPolicyStream: true
build:
  - name: Install backend dependencies
    dirVar: backend_source_dir
    requires: package.json
    command: ["npm", "ci", "--omit=dev"]
variableGroups:
  - title: Application
    variables:
      - name: app_name
        widget: text
        help: Lowercase name prefix used for every resource.
      - name: environment
        widget: select
        options: [dev, staging, prod]
      - name: aws_region
        widget: text
  - title: Application code
    variables:
      - name: backend_source_dir
        widget: directory
        help: Folder with your Node backend handler.handler export. Leave default for the sample API.
      - name: frontend_dist_dir
        widget: directory
        help: Folder of your built static frontend (e.g. Next.js `out/`). Leave default for the sample site.
  - title: Backend
    variables:
      - name: lambda_memory_mb
        widget: number
        help: Memory for the API Lambda, in megabytes.
  - title: Database
    variables:
      - name: enable_point_in_time_recovery
        widget: switch
  - title: Advanced
    variables:
      - name: tags
        widget: textarea
        help: Extra tags as a JSON object, applied to every resource.
outputs:
  - name: api_endpoint
    primary: true
  - name: frontend_website_endpoint
    primary: true
  - name: frontend_bucket
  - name: dynamodb_table
