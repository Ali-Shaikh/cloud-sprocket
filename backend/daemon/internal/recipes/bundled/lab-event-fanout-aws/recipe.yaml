apiVersion: cloudsprocket.recipe/v1
id: lab-event-fanout-aws
kind: service-lab
version: 0.1.0
name: Event fan-out lab (SNS → SQS → Lambda)
summary: Publish to SNS, buffer on SQS, and process with a Lambda consumer.
description: |
  A focused service lab for event fan-out: an SNS topic forwards messages to an
  SQS queue consumed by a Node.js Lambda. Emulates on LocalStack's free tier.
providers:
  - aws
tags:
  - sns
  - sqs
  - lambda
  - events
  - aws
  - lab
engine:
  type: opentofu
  minVersion: "1.6.0"
local:
  runtimes:
    - id: localstack
build:
  - name: Install worker dependencies
    dirVar: worker_source_dir
    requires: package.json
    command: ["npm", "install", "--omit=dev"]
variableGroups:
  - title: Application
    variables:
      - name: app_name
        widget: text
      - name: environment
        widget: select
        options: [dev, staging, prod]
      - name: aws_region
        widget: text
  - title: Worker code
    variables:
      - name: worker_source_dir
        widget: directory
        help: Folder with your SQS worker handler. Leave default for the sample worker.
  - title: Advanced
    variables:
      - name: tags
        widget: textarea
outputs:
  - name: topic_arn
    primary: true
  - name: queue_url
    primary: true
  - name: lambda_function_name
lab:
  difficulty: intermediate
  estimatedMinutes: 25
  objectives:
    - Trace an event from SNS through SQS to the worker Lambda
    - Send a queue message and verify fan-out plumbing
  steps:
    - id: explore-topic
      title: Explore the SNS topic
      body: |
        Open the SNS tab and inspect the topic that forwards messages to the queue.
      actions:
        - type: open-tab
          tab: aws-sns
          focus: "{{ outputs.topic_arn }}"
      verify:
        - type: sns.subscription
          topic: "{{ outputs.topic_arn }}"
          compare: gte
          value: "1"
      hints:
        - The topic ARN is in the `topic_arn` deployment output.
    - id: explore-queue
      title: Explore the SQS queue
      body: |
        Open the SQS tab and inspect the queue subscribed to the topic.
      actions:
        - type: open-tab
          tab: aws-sqs
          focus: "{{ outputs.queue_url }}"
    - id: send-message
      title: Send a test message
      body: |
        Send a JSON message directly to the queue to simulate a published event
        reaching the consumer.
      actions:
        - type: invoke-write
          op: sqs.send
          params:
            queueUrl: "{{ outputs.queue_url }}"
            messageBody: '{"lab":"event-fanout","demo":1}'
    - id: verify-queue
      title: Verify queue activity
      body: |
        Run the check to confirm messages are visible or in flight while the worker runs.
      verify:
        - type: sqs.queue-attribute
          queue: "{{ outputs.queue_url }}"
          attribute: ApproximateNumberOfMessagesNotVisible
          compare: gte
          value: "0"
    - id: inspect-lambda
      title: Inspect the worker Lambda
      body: |
        Open the Lambda tab to view the function consuming the queue.
      actions:
        - type: open-tab
          tab: aws-lambda
          focus: "{{ outputs.lambda_function_name }}"