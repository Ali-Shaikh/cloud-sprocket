apiVersion: cloudsprocket.recipe/v1
id: api-dynamodb-serverless-aws
kind: app-deploy
version: 0.1.0
name: API + DynamoDB (serverless)
summary: A Node API on Lambda behind API Gateway with a DynamoDB table.
description: |
  Deploy your Node backend as a serverless HTTP API backed by DynamoDB. The
  bundled sample API returns table metadata so a first apply works without
  custom code.

  Uses only API Gateway, Lambda and DynamoDB, which emulate on LocalStack's
  free tier, so it dry-runs locally without Pro services.
providers:
  - aws
tags:
  - serverless
  - dynamodb
  - api
  - aws
  - starter
engine:
  type: opentofu
  minVersion: "1.6.0"
local:
  runtimes:
    - id: localstack
build:
  - name: Install backend dependencies
    dirVar: backend_source_dir
    requires: package.json
    command: ["npm", "install", "--omit=dev"]
variableGroups:
  - title: Application
    variables:
      - name: app_name
        widget: text
      - name: environment
        widget: select
        options: [dev, staging, prod]
      - name: aws_region
        widget: text
  - title: Application code
    variables:
      - name: backend_source_dir
        widget: directory
        help: Folder with your Node backend handler.handler export. Leave default for the sample API.
  - title: Backend
    variables:
      - name: lambda_memory_mb
        widget: number
  - title: Database
    variables:
      - name: enable_point_in_time_recovery
        widget: checkbox
        help: Enable DynamoDB point-in-time recovery (recommended for production).
  - title: Advanced
    variables:
      - name: tags
        widget: textarea
outputs:
  - name: api_endpoint
    primary: true
  - name: dynamodb_table
    primary: true