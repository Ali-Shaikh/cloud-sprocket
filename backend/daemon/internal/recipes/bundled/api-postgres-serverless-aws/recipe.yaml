apiVersion: cloudsprocket.recipe/v1
id: api-postgres-serverless-aws
kind: app-deploy
version: 0.1.0
name: API + Postgres (serverless)
summary: A Node API on Lambda behind API Gateway with a managed Postgres database on RDS.
description: |
  Deploy your Node backend as a serverless HTTP API with a Postgres database wired
  in. The sample API returns connection details so a first apply works without
  custom code. Uses RDS, which only emulates on LocalStack Pro.

  Point `backend_source_dir` at your handler folder or keep the bundled sample.
providers:
  - aws
tags:
  - serverless
  - postgres
  - api
  - aws
  - starter
engine:
  type: opentofu
  minVersion: "1.6.0"
local:
  runtimes:
    - id: localstack
      requiresPro: true
superpowers:
  iamPolicyStream: true
build:
  - name: Install backend dependencies
    dirVar: backend_source_dir
    requires: package.json
    command: ["npm", "ci", "--omit=dev"]
# Migrations run against the live database, which does not exist until apply. Build
# steps run before plan, so a migration step here cannot reach the DB. Run migrations
# from your app after the first deploy using the database_url output (a post-apply
# lifecycle phase is tracked for a future release).
variableGroups:
  - title: Application
    variables:
      - name: app_name
        widget: text
      - name: environment
        widget: select
        options: [dev, staging, prod]
      - name: aws_region
        widget: text
  - title: Application code
    variables:
      - name: backend_source_dir
        widget: directory
        help: Folder with your Node backend handler.handler export. Leave default for the sample API.
  - title: Backend
    variables:
      - name: lambda_memory_mb
        widget: number
  - title: Database
    variables:
      - name: db_username
        widget: text
      - name: db_password
        widget: password
      - name: db_instance_class
        widget: text
  - title: Advanced
    variables:
      - name: tags
        widget: textarea
outputs:
  - name: api_endpoint
    primary: true
  - name: database_url
    primary: true
  - name: database_endpoint