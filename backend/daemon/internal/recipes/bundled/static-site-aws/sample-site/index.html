<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CloudSprocket sample site</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">CloudSprocket recipe</p>
      <h1>Static website deployed from a bundled sample.</h1>
      <p class="lede">
        Replace this folder with your own Vite dist, Next.js export, or plain
        HTML output when you are ready to ship real content.
      </p>
      <section class="status" aria-label="Deployment checks">
        <div>
          <strong>S3 website hosting</strong>
          <span>Enabled</span>
        </div>
        <div>
          <strong>Sample content upload</strong>
          <span>Ready</span>
        </div>
      </section>
    </main>
  </body>
</html>
