apiVersion: cloudsprocket.recipe/v1
id: lab-dynamodb-aws
kind: service-lab
version: 0.1.0
name: DynamoDB lab (AWS)
summary: A single on-demand DynamoDB table you can query from your app.
description: |
  A focused service lab for DynamoDB: one pay-per-request table with a string
  partition key. Emulates on LocalStack's free tier.
providers:
  - aws
tags:
  - dynamodb
  - database
  - aws
  - lab
engine:
  type: opentofu
  minVersion: "1.6.0"
local:
  runtimes:
    - id: localstack
variableGroups:
  - title: Application
    variables:
      - name: app_name
        widget: text
      - name: environment
        widget: select
        options: [dev, staging, prod]
      - name: aws_region
        widget: text
  - title: Advanced
    variables:
      - name: tags
        widget: textarea
outputs:
  - name: table_name
    primary: true
  - name: table_arn
lab:
  difficulty: beginner
  estimatedMinutes: 15
  objectives:
    - Locate the on-demand DynamoDB table in the workspace
    - Understand the partition key layout for this lab table
  steps:
    - id: explore-table
      title: Open the DynamoDB table
      body: |
        Open the DynamoDB tab and select the table created by this deployment.
        Review the table status, billing mode, and key schema in the inspector.
      actions:
        - type: open-tab
          tab: aws-dynamodb
          focus: "{{ outputs.table_name }}"
      hints:
        - The table name is prefixed with your app name and environment.
    - id: note-outputs
      title: Note the table ARN
      body: |
        Copy the `table_arn` output from the deployment detail panel. You will use
        this ARN when wiring IAM policies or application SDK configuration.
      hints:
        - On LocalStack the ARN uses the emulated account id from your profile.