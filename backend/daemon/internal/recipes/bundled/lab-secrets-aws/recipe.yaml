apiVersion: cloudsprocket.recipe/v1
id: lab-secrets-aws
kind: service-lab
version: 0.1.0
name: Secrets Manager lab (AWS)
summary: A Secrets Manager secret with a starter value you can rotate later.
description: |
  A focused service lab for AWS Secrets Manager: one secret with an initial
  version. Emulates on LocalStack's free tier.
providers:
  - aws
tags:
  - secrets
  - security
  - aws
  - lab
engine:
  type: opentofu
  minVersion: "1.6.0"
local:
  runtimes:
    - id: localstack
variableGroups:
  - title: Application
    variables:
      - name: app_name
        widget: text
      - name: environment
        widget: select
        options: [dev, staging, prod]
      - name: aws_region
        widget: text
  - title: Secret
    variables:
      - name: secret_value
        widget: password
        help: Initial secret payload. Change after deploy in your app or the AWS console.
  - title: Advanced
    variables:
      - name: tags
        widget: textarea
outputs:
  - name: secret_arn
    primary: true
  - name: secret_name
lab:
  difficulty: beginner
  estimatedMinutes: 15
  objectives:
    - Find the Secrets Manager secret in the workspace
    - Understand how ARNs map to secret names in IAM policies
  steps:
    - id: explore-secret
      title: Open the secret
      body: |
        Open the Secrets Manager tab and select the secret created by this
        deployment. Review the ARN and description in the inspector.
      actions:
        - type: open-tab
          tab: aws-secrets
          focus: "{{ outputs.secret_name }}"
      hints:
        - The secret name is prefixed with your app name and environment.
    - id: note-arn
      title: Note the secret ARN
      body: |
        Copy the `secret_arn` output for use in application configuration or IAM
        resource policies. Never commit secret values to source control.
      hints:
        - Rotate the initial value in your app after first deploy.