apiVersion: cloudsprocket.recipe/v1
id: azure-queue-function-azure
kind: app-deploy
version: 0.1.1
name: Queue triggered Functions (Azure)
summary: Queue-triggered Azure Functions on a real Azure subscription.
description: |
  Azure async messaging: deploy a storage queue plus a function app with queue
  binding in the sample code. Send messages to trigger processing.
  
  Requires a cloud Azure profile. floci-az does not fully emulate App Service
  plans or Function Apps, so local dry-run is not offered.
providers:
  - azure
tags:
  - azure
  - functions
  - queue
  - storage
  - messaging
  - cloud-azure
engine:
  type: opentofu
  minVersion: "1.6.0"
local:
  runtimes: []
variableGroups:
  - title: Application
    variables:
      - name: app_name
        widget: text
        help: Lowercase name prefix.
      - name: environment
        widget: select
        options: [dev, staging, prod]
      - name: azure_location
        widget: text
  - title: Code
    variables:
      - name: backend_source_dir
        widget: directory
        help: Functions dir. Default sample queue trigger.
  - title: Advanced
    variables:
      - name: tags
        widget: textarea
outputs:
  - name: function_app_name
    primary: true
  - name: storage_account_name
  - name: queue_name
  - name: resource_group_name
lab:
  difficulty: beginner
  estimatedMinutes: 22
  objectives:
    - Provision queue and queue-triggered function
    - Verify resources in Azure tabs
  steps:
    - id: inspect-queue
      title: Check storage queue
      body: |
        Use outputs to locate the queue in storage resources, then verify the
        queue depth is zero before traffic arrives.
      actions:
        - type: open-tab
          tab: azure-storage
          focus: "{{ outputs.storage_account_name }}"
      verify:
        - type: azure.queue-depth
          account: "{{ outputs.storage_account_name }}"
          queue: "{{ outputs.queue_name }}"
          compare: eq
          value: "0"
    - id: inspect-func
      title: Inspect function app
      body: Open function app details.
      actions:
        - type: open-tab
          tab: azure-functions
          focus: "{{ outputs.function_app_name }}"
