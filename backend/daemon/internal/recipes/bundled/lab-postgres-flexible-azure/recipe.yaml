apiVersion: cloudsprocket.recipe/v1
id: lab-postgres-flexible-azure
kind: service-lab
version: 0.1.1
name: PostgreSQL Flexible Server lab (Azure)
summary: Provision Azure Database for PostgreSQL Flexible Server on a real Azure subscription.
description: |
  A focused service lab for Azure Database for PostgreSQL Flexible Server
  (Microsoft.DBforPostgreSQL/flexibleServers). Provisions one flexible server, a
  starter database, and a permissive firewall rule for local development clients.

  Requires a cloud Azure profile. floci-az can start a Docker Postgres container for
  this API, but the azurerm OpenTofu provider rejects floci's create response
  (HTTP 201 with a completed body), so local dry-run apply fails after ~1 minute.
  Use a real subscription until floci returns a provider-compatible create path.

  Open the azure-postgres tab after apply for connection details. Cloud Azure
  enforces TLS 1.2+.
providers:
  - azure
tags:
  - postgres
  - postgresql
  - database
  - azure
  - lab
  - cloud-azure
engine:
  type: opentofu
  minVersion: "1.6.0"
local:
  runtimes: []
superpowers:
  iamPolicyStream: false
variableGroups:
  - title: Application
    variables:
      - name: app_name
        widget: text
        help: Lowercase name prefix used for every resource.
      - name: environment
        widget: select
        options: [dev, staging, prod]
      - name: azure_location
        widget: text
        help: Azure region (for example westeurope or eastus).
  - title: Server
    variables:
      - name: pg_admin_username
        widget: text
        help: Administrator login for the server.
      - name: pg_admin_password
        widget: password
        help: Administrator password. Stored as a sensitive variable.
      - name: pg_version
        widget: select
        options: ["13", "14", "15", "16", "17"]
        help: PostgreSQL major version.
      - name: pg_sku_name
        widget: text
        help: Compute SKU (for example B_Standard_B1ms).
      - name: pg_storage_mb
        widget: number
        help: Provisioned storage in MB (for example 32768).
  - title: Database
    variables:
      - name: database_name
        widget: text
        help: Name of the starter database created on the server.
  - title: Advanced
    variables:
      - name: tags
        widget: textarea
        help: Extra tags as a JSON object.
outputs:
  - name: server_name
    primary: true
  - name: server_fqdn
    primary: true
  - name: database_name
  - name: resource_group_name
  - name: admin_username
  - name: connection_hint
lab:
  difficulty: beginner
  estimatedMinutes: 25
  objectives:
    - Find the PostgreSQL flexible server provisioned by this deployment
    - Read connection details for cloud access
  steps:
    - id: explore-server
      title: Open the PostgreSQL server
      body: |
        Open the PostgreSQL workspace tab and select the flexible server created
        by this deployment. Note the server name, location, and SKU shown in the
        inspector.
      actions:
        - type: open-tab
          tab: azure-postgres
          focus: "{{ outputs.server_name }}"
      hints:
        - The server name matches the `server_name` deployment output.
    - id: review-database
      title: Review the starter database
      body: |
        Confirm the starter database from the `database_name` output exists on the
        server. Azure cloud enforces TLS 1.2+ for client connections.
      hints:
        - Use the admin username from deployment outputs with your secret password.
    - id: read-connection-hint
      title: Read the connection hint
      body: |
        Open the deployment outputs panel and read `connection_hint` alongside
        `server_fqdn` and `admin_username`. Use these values in your client or ORM
        connection string.
      hints:
        - Prefer TLS on real Azure; do not disable SSL for cloud servers.
