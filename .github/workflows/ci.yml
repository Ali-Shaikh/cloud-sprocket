name: ci

on:
  push:
    branches:
      - dev
      - main
  pull_request:

jobs:
  test-and-build:
    name: Test and Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: cloudsprocket-windows
            artifact_path: dist/CloudSprocket
          - os: macos-latest
            artifact_name: cloudsprocket-macos
            artifact_path: dist/CloudSprocket.app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,build]

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest --cache-clear

      - name: Build desktop artifact
        run: python -m cloudsprocket.build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
