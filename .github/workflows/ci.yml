name: ci

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: cloudsprocket-windows
            dev_artifact_paths: |
              apps/desktop/src-tauri/target/release/cloudsprocket-desktop.exe
              apps/desktop/src-tauri/binaries/cloudsprocketd-*.exe
          - os: macos-latest
            artifact_name: cloudsprocket-macos
            dev_artifact_paths: |
              apps/desktop/src-tauri/target/release/cloudsprocket-desktop
              apps/desktop/src-tauri/binaries/cloudsprocketd-*
          - os: ubuntu-latest
            artifact_name: cloudsprocket-linux
            dev_artifact_paths: |
              apps/desktop/src-tauri/target/release/cloudsprocket-desktop
              apps/desktop/src-tauri/binaries/cloudsprocketd-*

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache-dependency-path: backend/daemon/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run desktop tests
        run: pnpm run test:desktop

      - name: Run backend tests
        run: pnpm run test:backend

      - name: Build desktop verification binary
        if: github.event_name != 'push' || github.ref_type != 'tag'
        run: pnpm run build:desktop:exe

      - name: Build desktop release bundle
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: pnpm run build:desktop

      - name: Upload desktop verification artefact
        if: github.event_name != 'push' || github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-verification
          path: ${{ matrix.dev_artifact_paths }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload desktop release bundle
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-release
          path: apps/desktop/src-tauri/target/release/bundle
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
