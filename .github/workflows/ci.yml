name: ci

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: cloudsprocket-windows
            dev_artifact_paths: |
              apps/desktop/src-tauri/target/release/cloudsprocket-desktop.exe
              apps/desktop/src-tauri/binaries/cloudsprocketd-*.exe
            release_artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            artifact_name: cloudsprocket-macos
            dev_artifact_paths: |
              apps/desktop/src-tauri/target/release/cloudsprocket-desktop
              apps/desktop/src-tauri/binaries/cloudsprocketd-*
            release_artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            artifact_name: cloudsprocket-linux
            dev_artifact_paths: |
              apps/desktop/src-tauri/target/release/cloudsprocket-desktop
              apps/desktop/src-tauri/binaries/cloudsprocketd-*
            release_artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: backend/daemon/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run desktop tests
        run: pnpm run test:desktop

      - name: Run desktop type-check
        run: pnpm run typecheck:desktop

      - name: Run backend tests
        run: pnpm run test:backend

      - name: Run backend race tests
        if: runner.os == 'Linux'
        run: pnpm run test:backend:race

      - name: Build desktop verification binary
        if: github.event_name != 'push' || github.ref_type != 'tag'
        run: pnpm run build:desktop:exe

      - name: Build desktop release bundle
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: pnpm run build:desktop

      - name: Upload desktop verification artefact
        if: github.event_name != 'push' || github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-verification
          path: ${{ matrix.dev_artifact_paths }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload desktop release bundle
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-release
          path: ${{ matrix.release_artifact_paths }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: test-and-build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release bundles
        uses: actions/download-artifact@v7
        with:
          pattern: cloudsprocket-*-release
          merge-multiple: true
          path: dist

      - name: Prepare release installers
        run: |
          mkdir -p release-assets
          find dist -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp -v {} release-assets/ \;
          find release-assets -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CloudSprocket ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true

      # cloudsprocket.org fetches the latest release version and download links at build
      # time; Workers Builds only rebuilds on push, so an empty commit is the trigger.
      - name: Trigger site rebuild
        continue-on-error: true
        env:
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$SITE_PUSH_TOKEN" ]; then
            echo "SITE_PUSH_TOKEN secret not set; skipping site rebuild trigger."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${SITE_PUSH_TOKEN}@github.com/CloudSprocket/cloudsprocket.org.git" site-rebuild
          cd site-rebuild
          git -c user.name="cloudsprocket-release-bot" \
              -c user.email="releases@cloudsprocket.org" \
              commit --allow-empty -m "chore: rebuild for app release ${GITHUB_REF_NAME}"
          git push "https://x-access-token:${SITE_PUSH_TOKEN}@github.com/CloudSprocket/cloudsprocket.org.git" HEAD:master