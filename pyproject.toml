[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "cloudsprocket"
version = "0.1.0"
description = "CloudSprocket desktop shell for cloud auth and profile discovery."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.15"
authors = [
  { name = "CloudSprocket" },
]
dependencies = [
  "PySide6==6.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]
build = [
  "PyInstaller==6.19.0",
]

[project.scripts]
cloudsprocket = "cloudsprocket.__main__:main"
cloudsprocket-build = "cloudsprocket.build:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudsprocket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
