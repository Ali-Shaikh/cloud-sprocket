<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CloudSprocket — Redesign Prototype</title>
<style>
/* ============ DESIGN TOKENS ============ */
:root {
  --font: "Inter", "Segoe UI Variable", -apple-system, system-ui, sans-serif;
  --mono: "Cascadia Code", "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;

  /* Light theme */
  --bg: #f7f8fa;
  --rail-bg: #1b1d24;
  --sidebar-bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f3f5f8;
  --surface-3: #eceff4;
  --border: #e3e7ee;
  --border-strong: #d3d9e3;
  --text: #1a1d24;
  --text-2: #5a6473;
  --text-3: #8b95a5;
  --brand: #5b6cff;
  --brand-weak: #eef0ff;
  --brand-ink: #3a47cc;
  --green: #18a957;
  --green-weak: #e6f7ee;
  --amber: #d98c00;
  --amber-weak: #fdf3e1;
  --red: #e0413b;
  --red-weak: #fdecec;
  --shadow-sm: 0 1px 2px rgba(20,24,33,.06), 0 1px 3px rgba(20,24,33,.04);
  --shadow-md: 0 4px 12px rgba(20,24,33,.07), 0 2px 4px rgba(20,24,33,.04);
  --shadow-lg: 0 12px 32px rgba(20,24,33,.12);
  --radius: 12px;
  --radius-sm: 8px;
}
[data-theme="dark"] {
  --bg: #0e0f13;
  --rail-bg: #08090c;
  --sidebar-bg: #15171d;
  --surface: #15171d;
  --surface-2: #1b1e26;
  --surface-3: #20242d;
  --border: #262b35;
  --border-strong: #323845;
  --text: #e8ebf2;
  --text-2: #9aa3b2;
  --text-3: #6b7585;
  --brand: #7c8aff;
  --brand-weak: #1c1f33;
  --brand-ink: #aab4ff;
  --green-weak: #112318;
  --amber-weak: #2a2110;
  --red-weak: #2a1514;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 6px 18px rgba(0,0,0,.5);
  --shadow-lg: 0 16px 40px rgba(0,0,0,.6);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.5;
}
button { font-family: inherit; cursor: pointer; }

/* ============ APP SHELL ============ */
.app {
  display: grid;
  grid-template-columns: 68px 256px 1fr;
  height: 100vh;
  overflow: hidden;
}

/* ---- RAIL (Slack-style connection switcher) ---- */
.rail {
  background: var(--rail-bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0;
  gap: 6px;
}
.rail-brand {
  width: 40px; height: 40px;
  border-radius: 11px;
  background: linear-gradient(135deg, var(--brand), #8b5bff);
  display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: 15px;
  letter-spacing: -.5px;
  margin-bottom: 8px;
  box-shadow: 0 4px 12px rgba(91,108,255,.45);
}
.rail-sep { width: 28px; height: 1px; background: rgba(255,255,255,.1); margin: 4px 0; }
.rail-item {
  position: relative;
  width: 44px; height: 44px;
  border-radius: 13px;
  border: 0;
  background: rgba(255,255,255,.06);
  display: grid; place-items: center;
  transition: all .15s ease;
  color: #c7ccd6;
}
.rail-item img { width: 26px; height: 26px; }
.rail-item:hover { background: rgba(255,255,255,.14); border-radius: 15px; }
.rail-item.active { background: #fff; border-radius: 15px; }
.rail-item.active::before {
  content: ""; position: absolute; left: -12px; top: 50%; transform: translateY(-50%);
  width: 4px; height: 26px; border-radius: 0 4px 4px 0; background: #fff;
}
.rail-status {
  position: absolute; right: -2px; bottom: -2px;
  width: 13px; height: 13px; border-radius: 50%;
  border: 2.5px solid var(--rail-bg);
}
.rail-status.on { background: var(--green); }
.rail-status.off { background: #6b7585; }
.rail-status.err { background: var(--red); }
.rail-spacer { flex: 1; }
.rail-add {
  width: 44px; height: 44px; border-radius: 13px;
  border: 1.5px dashed rgba(255,255,255,.25);
  background: transparent; color: #9aa3b2; font-size: 22px; font-weight: 300;
  display: grid; place-items: center;
}
.rail-add:hover { border-color: var(--brand); color: #fff; }
.rail-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg,#ffb56b,#ff7eb3);
  display: grid; place-items: center; color:#fff; font-weight: 700; font-size: 13px;
}

/* ---- SIDEBAR (Docker-style contextual nav) ---- */
.sidebar {
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sb-head {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
}
.sb-conn {
  display: flex; align-items: center; gap: 10px;
}
.sb-conn-icon {
  width: 32px; height: 32px; border-radius: 9px;
  background: var(--surface-2);
  display: grid; place-items: center; flex: 0 0 auto;
}
.sb-conn-icon img { width: 22px; height: 22px; }
.sb-conn-name { font-weight: 700; font-size: 14px; }
.sb-conn-meta { font-size: 12px; color: var(--text-3); }
.sb-status-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.dot.on { background: var(--green); box-shadow: 0 0 0 3px var(--green-weak); }
.dot.off { background: #9aa3b2; }
.dot.err { background: var(--red); box-shadow: 0 0 0 3px var(--red-weak); }
.sb-status-text { font-size: 12px; color: var(--text-2); }

.sb-nav { padding: 10px 10px; overflow-y: auto; flex: 1; }
.sb-group-label {
  font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-3); padding: 12px 8px 6px;
}
.sb-item {
  width: 100%; border: 0; background: transparent;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--radius-sm);
  color: var(--text-2); font-size: 13.5px; font-weight: 500;
  text-align: left;
}
.sb-item:hover { background: var(--surface-2); color: var(--text); }
.sb-item.active { background: var(--brand-weak); color: var(--brand-ink); font-weight: 600; }
.sb-item .ico { width: 18px; height: 18px; flex: 0 0 auto; opacity: .85; }
.sb-item.active .ico { opacity: 1; }
.sb-item .count {
  margin-left: auto; font-size: 11px; font-weight: 700;
  background: var(--surface-3); color: var(--text-2);
  padding: 1px 7px; border-radius: 999px;
}
.sb-item.active .count { background: #fff; color: var(--brand-ink); }

.sb-foot { padding: 10px; border-top: 1px solid var(--border); display: grid; gap: 4px; }

/* ---- MAIN ---- */
.main { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
.topbar {
  height: 56px; flex: 0 0 auto;
  display: flex; align-items: center; gap: 14px;
  padding: 0 20px; border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.crumb { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-3); }
.crumb b { color: var(--text); font-weight: 600; }
.crumb .sep { color: var(--text-3); }
.search {
  margin-left: auto;
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 999px; padding: 7px 14px; width: 240px;
  color: var(--text-3); font-size: 13px;
}
.search input { border: 0; background: transparent; outline: 0; color: var(--text); width: 100%; font-family: inherit; font-size: 13px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--surface); display: grid; place-items: center; color: var(--text-2);
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }

.content { overflow-y: auto; padding: 24px 28px 40px; flex: 1; }
.view { display: none; }
.view.active { display: block; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---- Page header ---- */
.page-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 22px; }
.page-title { font-size: 22px; font-weight: 750; letter-spacing: -.3px; margin: 0; }
.page-sub { color: var(--text-2); font-size: 13.5px; margin: 3px 0 0; }
.page-actions { margin-left: auto; display: flex; gap: 8px; }

.btn {
  border: 1px solid var(--border-strong); background: var(--surface);
  color: var(--text); padding: 8px 14px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px;
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 2px 8px rgba(91,108,255,.35); }
.btn-primary:hover { background: var(--brand-ink); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); }
.btn svg { width: 15px; height: 15px; }

/* ---- Pills / badges ---- */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
.pill .dot { width: 7px; height: 7px; }
.pill.on { background: var(--green-weak); color: var(--green); }
.pill.off { background: var(--surface-3); color: var(--text-2); }
.pill.err { background: var(--red-weak); color: var(--red); }
.pill.amber { background: var(--amber-weak); color: var(--amber); }
.pill.brand { background: var(--brand-weak); color: var(--brand-ink); }

/* ---- Stat cards ---- */
.stat-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 24px; }
.stat {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow-sm);
}
.stat-label { font-size: 12px; color: var(--text-3); font-weight: 600; }
.stat-value { font-size: 26px; font-weight: 750; letter-spacing: -.5px; margin-top: 4px; }
.stat-foot { font-size: 12px; color: var(--text-2); margin-top: 4px; display:flex; align-items:center; gap:5px; }

/* ---- Connection cards (home) ---- */
.conn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 16px; }
.conn-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow-sm); transition: all .18s ease; cursor: pointer;
}
.conn-card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); transform: translateY(-2px); }
.conn-card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.conn-logo { width: 44px; height: 44px; border-radius: 11px; background: var(--surface-2); display: grid; place-items: center; }
.conn-logo img { width: 30px; height: 30px; }
.conn-card h3 { margin: 0; font-size: 15px; font-weight: 700; }
.conn-card .conn-card-sub { font-size: 12.5px; color: var(--text-3); }
.conn-meta-row { display: flex; gap: 18px; padding-top: 14px; margin-top: 14px; border-top: 1px solid var(--border); }
.conn-meta { font-size: 12px; }
.conn-meta b { display: block; font-size: 15px; font-weight: 700; }
.conn-meta span { color: var(--text-3); }
.conn-card.add {
  border-style: dashed; background: transparent; box-shadow: none;
  display: grid; place-items: center; text-align: center; color: var(--text-2);
  min-height: 168px;
}
.conn-card.add:hover { border-color: var(--brand); color: var(--brand-ink); }
.conn-card.add .plus { width: 44px; height: 44px; border-radius: 50%; background: var(--brand-weak); color: var(--brand); display: grid; place-items: center; font-size: 24px; margin: 0 auto 10px; }

/* ---- Resource cards (Docker Hub style) ---- */
.res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap: 14px; }
.res-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow-sm); transition: all .15s; cursor: pointer;
}
.res-card:hover { box-shadow: var(--shadow-md); border-color: var(--brand); }
.res-card-top { display: flex; align-items: flex-start; gap: 11px; }
.res-ico { width: 38px; height: 38px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; flex: 0 0 auto; }
.res-ico img { width: 24px; height: 24px; }
.res-card h4 { margin: 0; font-size: 14.5px; font-weight: 700; word-break: break-all; }
.res-card .res-sub { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.res-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 13px; }
.tag { font-size: 11.5px; color: var(--text-2); background: var(--surface-2); padding: 2px 8px; border-radius: 6px; font-weight: 500; }

/* ---- Table (Docker Desktop style) ---- */
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
.table-toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.table-toolbar .region {
  display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600;
  background: var(--surface-2); border:1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 11px;
}
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); padding: 11px 16px; border-bottom: 1px solid var(--border); }
td { padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--surface-2); }
.cell-main { font-weight: 600; }
.cell-id { font-family: var(--mono); font-size: 12px; color: var(--text-2); }
.row-actions { display: flex; gap: 6px; opacity: 0; transition: opacity .12s; }
tbody tr:hover .row-actions { opacity: 1; }
.mini-btn { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; color: var(--text-2); }
.mini-btn:hover { background: var(--surface-3); color: var(--text); }
.mini-btn.danger:hover { background: var(--red-weak); color: var(--red); border-color: var(--red); }

/* ---- Runtime / emulator cards ---- */
.rt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px,1fr)); gap: 16px; }
.rt-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
.rt-head { display: flex; align-items: center; gap: 13px; padding: 16px 18px; }
.rt-logo { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; flex: 0 0 auto; }
.rt-logo img { width: 28px; height: 28px; }
.rt-title { font-size: 15px; font-weight: 700; }
.rt-img { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }
.rt-body { padding: 0 18px 16px; }
.rt-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px; background: var(--surface-2); border-radius: var(--radius-sm); margin-bottom: 14px; }
.rt-meta div span { font-size: 11.5px; color: var(--text-3); display: block; }
.rt-meta div b { font-size: 13px; font-weight: 600; font-family: var(--mono); }
.rt-actions { display: flex; gap: 8px; align-items: center; }
.rt-log { background: #0c1018; color: #cde3ff; font-family: var(--mono); font-size: 11.5px; line-height: 1.6; padding: 12px 14px; border-radius: var(--radius-sm); max-height: 110px; overflow: hidden; margin-top: 14px; }
.rt-log .ln { white-space: pre; }
.rt-log .t { color: #5b7a9a; }
.rt-log .ok { color: #5fd38d; }

/* misc */
.section-title { font-size: 15px; font-weight: 700; margin: 28px 0 14px; }
.banner {
  display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: var(--radius);
  background: var(--brand-weak); border: 1px solid color-mix(in srgb, var(--brand) 22%, transparent);
  color: var(--brand-ink); font-size: 13px; margin-bottom: 22px;
}
.banner svg { width: 18px; height: 18px; flex: 0 0 auto; }
.banner .btn { margin-left: auto; }

/* theme + screen switch toolbar (prototype chrome only) */
.proto-bar {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: rgba(20,24,33,.92); backdrop-filter: blur(8px); color: #fff;
  border-radius: 999px; padding: 7px 9px; display: flex; gap: 6px; align-items: center;
  box-shadow: var(--shadow-lg); z-index: 99; font-size: 12px;
}
.proto-bar button { border: 0; background: rgba(255,255,255,.1); color: #cfd6e2; border-radius: 999px; padding: 6px 13px; font-weight: 600; font-size: 12px; }
.proto-bar button.on { background: #fff; color: #1b1d24; }
.proto-bar .lbl { color: #8b95a5; padding: 0 6px 0 10px; font-weight: 600; }
</style>
</head>
<body>
<div class="app">
  <!-- ============ RAIL ============ -->
  <nav class="rail">
    <div class="rail-brand">CS</div>
    <button class="rail-item active" data-conn="aws" onclick="setConn('aws')" title="AWS — sandbox">
      <img src="../apps/desktop/src/assets/cloud-icons/aws.svg" alt="AWS" />
      <span class="rail-status on"></span>
    </button>
    <button class="rail-item" data-conn="azure" onclick="setConn('azure')" title="Azure">
      <img src="../apps/desktop/src/assets/cloud-icons/azure.svg" alt="Azure" />
      <span class="rail-status off"></span>
    </button>
    <button class="rail-item" data-conn="gcp" onclick="setConn('gcp')" title="Google Cloud">
      <img src="../apps/desktop/src/assets/cloud-icons/gcp.svg" alt="GCP" />
      <span class="rail-status off"></span>
    </button>
    <div class="rail-sep"></div>
    <button class="rail-item" data-conn="local" onclick="setConn('local')" title="Local Runtime">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7cc4ff" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M7 20h10M9 16v4M15 16v4"/></svg>
      <span class="rail-status on"></span>
    </button>
    <button class="rail-add" title="Connect a cloud">+</button>
    <div class="rail-spacer"></div>
    <button class="rail-item" title="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <button class="rail-avatar">AS</button>
  </nav>

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="sb-head">
      <div class="sb-conn">
        <div class="sb-conn-icon" id="sbIcon"><img src="../apps/desktop/src/assets/cloud-icons/aws.svg" alt=""/></div>
        <div>
          <div class="sb-conn-name" id="sbName">AWS</div>
          <div class="sb-conn-meta" id="sbMeta">sandbox · CLI</div>
        </div>
      </div>
      <div class="sb-status-row">
        <span class="dot on" id="sbDot"></span>
        <span class="sb-status-text" id="sbStatus">Connected · eu-west-2</span>
      </div>
    </div>
    <div class="sb-nav" id="sbNav"><!-- filled by JS --></div>
    <div class="sb-foot">
      <button class="sb-item"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg> Activity</button>
      <button class="sb-item"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Docs</button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <div class="crumb"><b id="crumbConn">AWS</b><span class="sep">/</span><span id="crumbView">Overview</span></div>
      <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input placeholder="Search resources…  ⌘K" /></div>

let screen = "overview";

function setConn(c){

  document.getElementById('sbName').textContent = n.name;
  document.getElementById('sbMeta').textContent = n.meta;
  document.getElementById('sbStatus').textContent = n.status;
  document.getElementById('sbDot').className = 'dot '+n.dot;
  document.getElementById('sbIcon').innerHTML = n.icon ? `<img src="${n.icon}" alt=""/>` : ICONS.rt.replace('class="ico"','width="22" height="22"');
  document.getElementById('crumbConn').textContent = n.name;
  // build nav
  const nav = document.getElementById('sbNav'); nav.innerHTML='';
  n.groups.forEach(g=>{
    const lbl=document.createElement('div'); lbl.className='sb-group-label'; lbl.textContent=g.label; nav.appendChild(lbl);
    g.items.forEach(([id,label,ico,count])=>{
      const b=document.createElement('button'); b.className='sb-item'+((id===screen||(screen==='overview'&&id==='overview'))?' active':'');

      nav.appendChild(b);
    });
  });
  if(c!=='local' && screen==='local') setScreen('overview'); else renderActiveNav();
}

function renderActiveNav(){
  document.querySelectorAll('#sbNav .sb-item').forEach(b=>{
    const t=b.querySelector('span').textContent;
    const match = (screen==='s3'&&t.includes('Storage'))||(screen==='ec2'&&t.includes('Compute')&&conn==='aws')||(screen==='local'&&t.includes('Emulator'))||(screen==='overview'&&t==='Overview');
    b.classList.toggle('active', match);
  });
}

function setScreen(s){
  screen = s;
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.dataset.screen===s));
  document.querySelectorAll('.proto-bar button[data-screen]').forEach(b=>b.classList.toggle('on', b.dataset.screen===s));
  const titles={overview:'Overview',s3:'Storage',ec2:'Compute',local:'Emulators',connect:'Connect a cloud'};
  document.getElementById('crumbView').textContent = titles[s]||s;
  renderActiveNav();
  document.getElementById('content').scrollTop=0;
}

function toggleTheme(){
  const h=document.documentElement;
  const dark = h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme', dark?'light':'dark');
  document.getElementById('themeBtn').textContent = dark?'🌙 Dark':'☀️ Light';
}
